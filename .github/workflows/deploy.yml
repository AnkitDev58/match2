name: Deploy Website

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Make gradlew executable
        run: chmod +x gradlew


      - name: Build Web
        timeout-minutes: 30
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GRADLE_OPTS: "-Xmx4g"
        run: ./gradlew jsBrowserDistribution --info


      - name: Check build output
        run: |
          echo "Generated files:"
          find webApp/build/dist -maxdepth 4 -type f | head -100


      # Required for Compose Web routing on GitHub Pages
      - name: Fix SPA routing
        run: |
          cp webApp/build/dist/js/productionExecutable/index.html \
             webApp/build/dist/js/productionExecutable/404.html


      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/js/productionExecutable



  deploy:

    needs: build

    runs-on: ubuntu-latest


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4